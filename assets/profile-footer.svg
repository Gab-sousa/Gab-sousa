<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Rodapé do perfil de Gabriel Sousa</title>
  <desc id="desc">Rodapé preto com gradiente roxo e rosa e convite para construir algo juntos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05030a"/><stop offset=".5" stop-color="#170724"/><stop offset="1" stop-color="#05030a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset=".52" stop-color="#d946ef"/><stop offset="1" stop-color="#ff4da6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" rx="20" fill="url(#bg)"/>
  <rect x="250" y="30" width="700" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="600" y="82" text-anchor="middle" fill="#f8f4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650">Vamos construir algo incrível juntos?</text>
  <text x="600" y="113" text-anchor="middle" fill="#bdaec9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Gabriel Sousa • São Paulo, Brasil</text>
  <rect x="1.5" y="1.5" width="1197" height="147" rx="18.5" fill="none" stroke="url(#accent)" stroke-opacity=".38" stroke-width="3"/>
</svg>
